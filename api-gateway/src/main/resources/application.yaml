server:
  port: 8081

spring:
  application:
    name: api-gateway

  cloud:
    consul:
      host: localhost
      port: 8500

      discovery:
        prefer-ip-address: true

    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/users,/users/**

            - id: user-static
              uri: lb://user-service
              predicates:
                - Path=/uploads/**

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8181/realms/legal-plaform

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: always