server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    consul:
      host: localhost
      port: 8500

      discovery:
        prefer-ip-address: true

    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/users/**
        - id: lawyer-service
          uri: lb://lawyer-service
          predicates:
            - Path=/lawyers/**
        - id: appointment-service
          uri: lb://appointment-service
          predicates:
            - Path=/appointments/**

            - id: user-static
              uri: lb://user-service
              predicates:
                - Path=/uploads/**

            - id: messaging-service
              uri: lb://messaging-service
              predicates:
                - Path=/messages,/messages/**

            - id: messaging-service-ws
              uri: lb:ws://messaging-service
              predicates:
                - Path=/ws-chat,/ws-chat/**

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8181/realms/legal-plaform

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: always