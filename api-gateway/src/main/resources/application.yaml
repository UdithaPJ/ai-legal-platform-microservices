server:
  port: 8081

spring:
  application:
    name: api-gateway

  cloud:
    consul:
      host: localhost
      port: 8500

      discovery:
        prefer-ip-address: true

    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/users/**
        - id: lawyer-service
          uri: lb://lawyer-service
          predicates:
            - Path=/lawyers/**
        - id: appointment-service
          uri: lb://appointment-service
          predicates:
            - Path=/appointments/**

        - id: user-static
          uri: lb://user-service
          predicates:
            - Path=/uploads/**

        - id: messaging-service
          uri: lb://messaging-service
          predicates:
            - Path=/messages/**

        - id: messaging-service-ws
          uri: lb:ws://messaging-service
          predicates:
            - Path=/ws-chat/**

        - id: ai-analysis-service
          uri: lb://ai-analysis-service
          predicates:
            - Path=/analysis/**

        - id: video-session-service
          uri: lb://video-session-service
          predicates:
            - Path=/video-sessions,/video-sessions/**

        # --- OpenAPI docs passthrough for Swagger UI aggregation ---
        - id: user-service-api-docs
          uri: lb://user-service
          predicates:
            - Path=/v3/api-docs/user-service
          filters:
            - RewritePath=/v3/api-docs/user-service, /v3/api-docs

        - id: appointment-service-api-docs
          uri: lb://appointment-service
          predicates:
            - Path=/v3/api-docs/appointment-service
          filters:
            - RewritePath=/v3/api-docs/appointment-service, /v3/api-docs

        - id: messaging-service-api-docs
          uri: lb://messaging-service
          predicates:
            - Path=/v3/api-docs/messaging-service
          filters:
            - RewritePath=/v3/api-docs/messaging-service, /v3/api-docs

        - id: lawyer-service-api-docs
          uri: lb://lawyer-service
          predicates:
            - Path=/v3/api-docs/lawyer-service
          filters:
            - RewritePath=/v3/api-docs/lawyer-service, /v3/api-docs

        - id: video-session-service-api-docs
          uri: lb://video-session-service
          predicates:
            - Path=/v3/api-docs/video-session-service
          filters:
            - RewritePath=/v3/api-docs/video-session-service, /v3/api-docs
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8181/realms/legal-plaform

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    urls:
      - name: user-service
        url: /v3/api-docs/user-service
      - name: lawyer-service
        url: /v3/api-docs/lawyer-service
      - name: appointment-service
        url: /v3/api-docs/appointment-service
      - name: messaging-service
        url: /v3/api-docs/messaging-service
      - name: ai-analysis-service
        url: /analysis/openapi.json

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: always