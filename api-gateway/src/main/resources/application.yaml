server:
  port: 8081

spring:
  application:
    name: api-gateway

  cloud:
    consul:
      host: localhost
      port: 8500

      discovery:
        prefer-ip-address: true

    gateway:
      discovery:
        locator:
          enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: always