server:
  port: 8080

# ── CORS ──────────────────────────────────────────────────────────────────
# Dev:  localhost:3000 only.
# Prod: docker-compose.tunnel.yml overrides CORS_ALLOWED_ORIGINS with the
#       Azure SWA origin so nothing needs to change here for production.
cors:
  # Comma-separated string — @Value on List<String> splits by comma.
  # YAML list syntax (- item) creates indexed keys (cors.allowed-origins[0]) which
  # @Value cannot resolve as a single placeholder.
  # Docker / tunnel override: set CORS_ALLOWED_ORIGINS env var with comma-separated origins.
  allowed-origins: "http://localhost:3000"

# ── Keycloak JWT config ────────────────────────────────────────────────────
keycloak:
  # Dev:    http://localhost:8181/...  (default, no env var needed)
  # Docker: overridden by KEYCLOAK_JWKS_URI=http://keycloak:8080/... in docker-compose.yml
  jwks-uri: http://localhost:8181/realms/legal-platform/protocol/openid-connect/certs
  # Comma-separated string for the same @Value / List<String> reason as cors.allowed-origins.
  trusted-issuers: "http://localhost:8181/realms/legal-platform,https://auth.legalai.bond/realms/legal-platform"

spring:
  application:
    name: api-gateway

  cloud:
    consul:
      host: localhost
      port: 8500

      discovery:
        prefer-ip-address: true

    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/users/**
        - id: lawyer-service
          uri: lb://lawyer-service
          predicates:
            - Path=/lawyers/**
        - id: admin-lawyer-service
          uri: lb://lawyer-service
          predicates:
            - Path=/admin/lawyers/**
        - id: appointment-service
          uri: lb://appointment-service
          predicates:
            - Path=/appointments/**

        - id: user-static
          uri: lb://user-service
          predicates:
            - Path=/uploads/**

        - id: messaging-service
          uri: lb://messaging-service
          predicates:
            - Path=/messages/**

        - id: messaging-service-ws
          uri: lb:ws://messaging-service
          predicates:
            - Path=/ws-chat/**

        - id: ai-analysis-service
          uri: lb://ai-analysis-service
          predicates:
            - Path=/analysis/**

        - id: video-session-service
          uri: lb://video-session-service
          predicates:
            - Path=/video-sessions/**

        - id: review-rating-service
          uri: lb://review-rating-service
          predicates:
            - Path=/reviews/**

        - id: document-service
          uri: lb://document-service
          predicates:
            - Path=/documents/**

        # --- OpenAPI docs passthrough for Swagger UI aggregation ---
        - id: user-service-api-docs
          uri: lb://user-service
          predicates:
            - Path=/v3/api-docs/user-service
          filters:
            - RewritePath=/v3/api-docs/user-service, /v3/api-docs

        - id: appointment-service-api-docs
          uri: lb://appointment-service
          predicates:
            - Path=/v3/api-docs/appointment-service
          filters:
            - RewritePath=/v3/api-docs/appointment-service, /v3/api-docs

        - id: messaging-service-api-docs
          uri: lb://messaging-service
          predicates:
            - Path=/v3/api-docs/messaging-service
          filters:
            - RewritePath=/v3/api-docs/messaging-service, /v3/api-docs

        - id: lawyer-service-api-docs
          uri: lb://lawyer-service
          predicates:
            - Path=/v3/api-docs/lawyer-service
          filters:
            - RewritePath=/v3/api-docs/lawyer-service, /v3/api-docs

        - id: video-session-service-api-docs
          uri: lb://video-session-service
          predicates:
            - Path=/v3/api-docs/video-session-service
          filters:
            - RewritePath=/v3/api-docs/video-session-service, /v3/api-docs

        - id: review-rating-service-api-docs
          uri: lb://review-rating-service
          predicates:
            - Path=/v3/api-docs/review-rating-service
          filters:
            - RewritePath=/v3/api-docs/review-rating-service, /v3/api-docs

        - id: document-service-api-docs
          uri: lb://document-service
          predicates:
            - Path=/v3/api-docs/document-service
          filters:
            - RewritePath=/v3/api-docs/document-service, /v3/api-docs

  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer-uri is overridden by the custom ReactiveJwtDecoder bean in SecurityConfig.
          issuer-uri: http://localhost:8181/realms/legal-platform

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    urls:
      - name: user-service
        url: /v3/api-docs/user-service
      - name: lawyer-service
        url: /v3/api-docs/lawyer-service
      - name: appointment-service
        url: /v3/api-docs/appointment-service
      - name: messaging-service
        url: /v3/api-docs/messaging-service
      - name: ai-analysis-service
        url: /analysis/openapi.json
      - name: video-session-service
        url: /v3/api-docs/video-session-service
      - name: review-rating-service
        url: /v3/api-docs/review-rating-service
      - name: document-service
        url: /v3/api-docs/document-service

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: always
