server:
  port: 8081

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://localhost:5433/user_service_db
    username: postgres
    password: password

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        enabled: true
        register: true
        instance-id: ${spring.application.name}-${server.port}
        health-check-path: /actuator/health
        health-check-interval: 30s
        prefer-ip-address: true

  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: user-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
    # Producer needed by DeadLetterPublishingRecoverer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  kafka:
    topics:
      userEvents: user.events.v1
      userEventsDlq: user.events.v1.dlq

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

file:
  # Local dev: relative path from the project root where `mvn spring-boot:run` is executed.
  # Docker:    overridden by FILE_UPLOAD_DIR=/app/uploads/profile-pictures/ env var.
  upload-dir: services/user-service/uploads/profile-pictures/
