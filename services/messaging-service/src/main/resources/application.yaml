server:
  port: 8084

spring:
  application:
    name: messaging-service

  datasource:
    url: jdbc:postgresql://localhost:5433/messaging_db
    username: postgres
    password: password

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        prefer-ip-address: true

  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer-uri is overridden by the custom JwtDecoder bean in SecurityConfig,
          # which accepts localhost, LAN IP, and the public Cloudflare domain.
          issuer-uri: http://localhost:8181/realms/legal-platform

  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: messaging-service
      auto-offset-reset: earliest
      enable-auto-commit: true
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

keycloak:
  # Dev:    http://localhost:8181/...  (default, no env var needed)
  # Docker: overridden by KEYCLOAK_JWKS_URI=http://keycloak:8080/... in docker-compose.yml
  jwks-uri: http://localhost:8181/realms/legal-platform/protocol/openid-connect/certs
  # Comma-separated — @Value on List<String> cannot resolve YAML list-syntax keys.
  trusted-issuers: "http://localhost:8181/realms/legal-platform,https://auth.legalai.bond/realms/legal-platform"

app:
  kafka:
    topics:
      workflowEvents: workflow.events.v1

management:
  endpoints:
    web:
      exposure:
        include: health
