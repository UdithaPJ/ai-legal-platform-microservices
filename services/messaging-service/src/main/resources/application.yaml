server:
  port: 8084

spring:
  application:
    name: messaging-service

  datasource:
    url: jdbc:postgresql://localhost:5433/messaging_db
    username: postgres
    password: password

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  cloud:
    consul:
      host: localhost
      port: 8500

      discovery:
        prefer-ip-address: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8181/realms/legal-platform

  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: messaging-service
      auto-offset-reset: earliest
      enable-auto-commit: true
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

app:
  kafka:
    topics:
      workflowEvents: workflow.events.v1

management:
  endpoints:
    web:
      exposure:
        include: health