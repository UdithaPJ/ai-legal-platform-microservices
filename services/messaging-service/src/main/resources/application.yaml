server:
  port: 8085

spring:
  application:
    name: messaging-service

  datasource:
    url: jdbc:postgresql://localhost:5432/messaging_db
    username: postgres
    password: password

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  cloud:
    consul:
      host: localhost
      port: 8500

      discovery:
        prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health