server:
  port: 8084

spring:
  application:
    name: messaging-service

  datasource:
    url: jdbc:postgresql://localhost:5433/messaging_db
    username: postgres
    password: password

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  cloud:
    consul:
      host: localhost
      port: 8500

      discovery:
        prefer-ip-address: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8181/realms/legal-plaform

management:
  endpoints:
    web:
      exposure:
        include: health