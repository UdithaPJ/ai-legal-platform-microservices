server:
  port: 8086

spring:
  application:
    name: video-session-service

  datasource:
    url: jdbc:postgresql://localhost:5433/video_session_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  cloud:
    consul:
      host: localhost          # Use 'consul' when running in Docker
      port: 8500
      discovery:
        enabled: true
        register: true
        instance-id: ${spring.application.name}-${server.port}
        health-check-path: /actuator/health
        health-check-interval: 10s
        prefer-ip-address: true

  kafka:
    bootstrap-servers: localhost:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

app:
  kafka:
    topics:
      workflowEvents: workflow.events.v1

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
  circuitbreaker:
    enabled: false

# Jitsi-as-a-Service (8x8 JaaS) — signed JWT moderation, no port forwarding needed.
jitsi:
  base-url: ${JITSI_BASE_URL:https://8x8.vc}

jaas:
  # App ID from https://jaas.8x8.vc/#/start  (vpaas-magic-cookie-xxx)
  app-id: ${JAAS_APP_ID:vpaas-magic-cookie-d2e3d58cae2844fa9d316475c260d16d}
  # Full Key ID from the API Keys page  (appId/keyId)
  kid: ${JAAS_KID:vpaas-magic-cookie-d2e3d58cae2844fa9d316475c260d16d/02e30b}
  # Absolute path to the PEM private key file inside the container/JVM
  private-key-path: ${JAAS_PRIVATE_KEY_PATH:/etc/jaas/jaas-private-key.pk}
  ttl-seconds: 14400

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.project: DEBUG