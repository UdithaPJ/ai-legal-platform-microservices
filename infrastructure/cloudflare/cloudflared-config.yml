# Cloudflare Tunnel configuration
# ─────────────────────────────────────────────────────────────────────────────
# Replace <TUNNEL_ID> with the UUID printed by: cloudflared tunnel create legal-platform
#
# Ingress rules:
#   api.legalai.bond   → Spring Cloud Gateway  (localhost:8080)
#   auth.legalai.bond  → Keycloak               (localhost:8181)
#   app.legalai.bond is NOT routed here — it's served by Vercel.
# ─────────────────────────────────────────────────────────────────────────────

tunnel: d70a479a-de7a-4282-874d-bb3f39a574e1
credentials-file: /home/nonroot/tunnel-credentials.json

ingress:
  - hostname: api.legalai.bond
    service: http://api-gateway:8080
    originRequest:
      connectTimeout: 30s
      tcpKeepAlive: 30s
      keepAliveTimeout: 90s

  - hostname: auth.legalai.bond
    service: http://keycloak:8080
    originRequest:
      connectTimeout: 30s

  # app.legalai.bond is served by Vercel (see Vercel project DNS/domain settings),
  # not by this tunnel.

  # Required catch-all
  - service: http_status:404
