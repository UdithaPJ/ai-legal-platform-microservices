# Docker Compose OVERRIDE for Cloudflare Tunnel (production) mode.
#
# Usage — merge with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.tunnel.yml up -d
#
# Prerequisites (already done):
#   - Tunnel credentials file exists at %USERPROFILE%\.cloudflared\<tunnel-id>.json
#   - cloudflare/cloudflared-config.yml has the correct tunnel ID and ingress rules
# ─────────────────────────────────────────────────────────────────────────────

version: "3.9"

services:

  # ── Keycloak: switch issuer to the public Cloudflare domain ───────────────
  keycloak:
    environment:
      KC_HOSTNAME: auth.legalai.bond
      KC_HOSTNAME_PORT: 443
      KC_HOSTNAME_STRICT: "true"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_PROXY_HEADERS: xforwarded   # trust X-Forwarded-Proto: https from Cloudflare

  # ── API Gateway: allow the Azure SWA origin for CORS ─────────────────────
  api-gateway:
    environment:
      CORS_ALLOWED_ORIGINS: https://legal-platform.azurestaticapps.net,https://legalai.bond,https://app.legalai.bond

  # ── Cloudflare Tunnel sidecar ─────────────────────────────────────────────
  # Mounts the credentials file generated by `cloudflared tunnel create`
  # from the host's %USERPROFILE%\.cloudflared directory.
  cloudflared:
    build:
      context: ./cloudflare
      dockerfile: Dockerfile
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --config /home/nonroot/cloudflared-config.yml run
    network_mode: host
    depends_on:
      - keycloak
      - api-gateway
