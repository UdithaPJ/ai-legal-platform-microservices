# Docker Compose OVERRIDE for Cloudflare Tunnel (production) mode.
#
# Usage — merge with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.tunnel.yml up -d
#
# Prerequisites (already done):
#   - Tunnel credentials file exists at %USERPROFILE%\.cloudflared\<tunnel-id>.json
#   - cloudflare/cloudflared-config.yml has the correct tunnel ID and ingress rules
# ─────────────────────────────────────────────────────────────────────────────

version: "3.9"

services:

  # ── Keycloak: switch issuer to the public Cloudflare domain ───────────────
  keycloak:
    environment:
      KC_HOSTNAME: auth.legalai.bond
      KC_HOSTNAME_PORT: 443
      KC_HOSTNAME_STRICT: "true"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_PROXY_HEADERS: xforwarded   # trust X-Forwarded-Proto: https from Cloudflare

  # ── API Gateway: allow the Azure SWA origin for CORS ─────────────────────
  api-gateway:
    environment:
      CORS_ALLOWED_ORIGINS: https://legal-platform.azurestaticapps.net,https://legalai.bond,https://app.legalai.bond

  # ── Cloudflare Tunnel connectors (HA pair) ────────────────────────────────
  # Two replicas of the same tunnel, same credentials file — Cloudflare's edge
  # load-balances/fails over across connectors registered under one tunnel ID
  # automatically, no Cloudflare-side config needed beyond running >1 process.
  # Both stay on network_mode: host (still the simplest way to reach
  # api-gateway/keycloak at localhost:8080/8181), so each is given its own
  # --metrics bind address to avoid the two processes fighting over the same
  # host-local port; the readiness healthcheck is pointed at the matching port.
  cloudflared-1:
    build:
      context: ./cloudflare
      dockerfile: Dockerfile
    container_name: cloudflared-1
    restart: unless-stopped
    command: tunnel --config /home/nonroot/cloudflared-config.yml --metrics localhost:20241 run
    network_mode: host
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "localhost:20241", "ready"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      - keycloak
      - api-gateway

  cloudflared-2:
    build:
      context: ./cloudflare
      dockerfile: Dockerfile
    container_name: cloudflared-2
    restart: unless-stopped
    command: tunnel --config /home/nonroot/cloudflared-config.yml --metrics localhost:20242 run
    network_mode: host
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "localhost:20242", "ready"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      - keycloak
      - api-gateway
