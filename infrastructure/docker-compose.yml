version: "3.9"

# ══════════════════════════════════════════════════════════════════════════════
# AI Legal Platform — full local stack
#
# Start everything:   docker compose up -d
# Rebuild a service:  docker compose up -d --build <service-name>
# View logs:          docker compose logs -f <service-name>
#
# First-time Ollama model pull (run once after `docker compose up -d`):
#   docker exec ollama ollama pull nomic-embed-text
#   docker exec ollama ollama pull phi3:mini
# ══════════════════════════════════════════════════════════════════════════════

# ── Shared environment snippets (YAML anchors) ─────────────────────────────
x-spring-common: &spring-common
  SPRING_CLOUD_CONSUL_HOST: consul
  SPRING_CLOUD_CONSUL_PORT: 8500
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  # JWKS is fetched from Keycloak's internal Docker hostname (key material only,
  # not used for issuer validation — trusted-issuers list handles that).
  KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/legal-platform/protocol/openid-connect/certs

x-spring-db: &spring-db
  SPRING_DATASOURCE_USERNAME: postgres
  SPRING_DATASOURCE_PASSWORD: password

x-spring-healthcheck: &spring-healthcheck
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 90s

services:

  # ════════════════════════════════════════════════════════════════════════════
  # INFRASTRUCTURE
  # ════════════════════════════════════════════════════════════════════════════

  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d

  keycloak:
    build:
      context: ../keycloak-role-assignment-spi
      dockerfile: Dockerfile
    container_name: keycloak
    command:
      - start-dev
      - --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_USER_EVENTS_TOPIC: user.events.v1
      # Dev: tokens issued with iss=http://localhost:8181/realms/legal-platform
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8181
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
    ports:
      - "8181:8080"
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import
      - ./keycloak/keycloak-theme-for-kc-26.jar:/opt/keycloak/providers/keycloak-theme.jar
    healthcheck:
      # No curl in the UBI9 minimal image — use bash /dev/tcp to make a raw HTTP request.
      # Opens a TCP connection to port 8080, sends a minimal GET, and checks the status line.
      test: ["CMD", "bash", "-c",
             "exec 3<>/dev/tcp/localhost/8080 && \
              printf 'GET /realms/master HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && \
              head -1 <&3 | grep -q 200"]
      interval: 15s
      timeout: 10s
      retries: 25          # 25 × 15s = 375s of retries
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  consul:
    image: hashicorp/consul:1.17
    container_name: consul
    ports:
      - "8500:8500"
    command: "agent -dev -client=0.0.0.0"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8500/v1/status/leader || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list 1>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
    depends_on:
      zookeeper:
        condition: service_started

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    # GPU support: uncomment below if running on a host with an NVIDIA GPU
    # and the NVIDIA Container Toolkit installed. CPU-only hosts (e.g. Oracle
    # Cloud Ampere A1) must leave this commented out — Docker will fail to
    # start the container otherwise.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Pulls required Ollama models on first start; exits immediately if they are
  # already present in the ollama_data volume (subsequent runs are instant).
  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: >
      /bin/sh -c "
        ollama pull nomic-embed-text &&
        ollama pull phi3:mini
      "
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ════════════════════════════════════════════════════════════════════════════
  # SPRING MICROSERVICES
  # ════════════════════════════════════════════════════════════════════════════

  api-gateway:
    build:
      context: ../api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      <<: *spring-common
      SPRING_CLOUD_CONSUL_HOST: consul
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      <<: *spring-healthcheck
    depends_on:
      consul:
        condition: service_healthy
      keycloak:
        condition: service_started   # JwtDecoder is lazy — JWKS fetched on first request, not at boot

  user-service:
    build:
      context: ../services/user-service
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      <<: [*spring-common, *spring-db]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/user_service_db
      FILE_UPLOAD_DIR: /app/uploads/profile-pictures/
    volumes:
      - user_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      <<: *spring-healthcheck
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy
      kafka:
        condition: service_healthy

  lawyer-service:
    build:
      context: ../services/lawyer-profile-service
      dockerfile: Dockerfile
    container_name: lawyer-service
    ports:
      - "8082:8082"
    environment:
      <<: [*spring-common, *spring-db]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lawyerdb
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      <<: *spring-healthcheck
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy
      kafka:
        condition: service_healthy

  appointment-service:
    build:
      context: ../services/appointment-service
      dockerfile: Dockerfile
    container_name: appointment-service
    ports:
      - "8083:8083"
    environment:
      <<: [*spring-common, *spring-db]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/appointmentdb
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/actuator/health || exit 1"]
      <<: *spring-healthcheck
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy
      kafka:
        condition: service_healthy
      user-service:
        condition: service_started   # Feign calls happen at request time, not at boot
      lawyer-service:
        condition: service_started   # Feign calls happen at request time, not at boot

  messaging-service:
    build:
      context: ../services/messaging-service
      dockerfile: Dockerfile
    container_name: messaging-service
    ports:
      - "8084:8084"
    environment:
      <<: [*spring-common, *spring-db]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/messaging_db
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8084/actuator/health || exit 1"]
      <<: *spring-healthcheck
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_started   # JwtDecoder is lazy — JWKS fetched on first request, not at boot

  review-rating-service:
    build:
      context: ../services/review-rating-service
      dockerfile: Dockerfile
    container_name: review-rating-service
    ports:
      - "8085:8085"
    environment:
      <<: [*spring-common, *spring-db]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/review_db
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8085/actuator/health || exit 1"]
      <<: *spring-healthcheck
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy
      kafka:
        condition: service_healthy

  video-session-service:
    build:
      context: ../services/video-session-service
      dockerfile: Dockerfile
    container_name: video-session-service
    ports:
      - "8086:8086"
    environment:
      <<: [*spring-common, *spring-db]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/video_session_db
      JAAS_PRIVATE_KEY_PATH: /etc/jaas/jaas-private-key.pk
    volumes:
      # JaaS RSA private key — file is git-ignored, see infrastructure/jaas/README.md
      - ./jaas:/etc/jaas:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8086/actuator/health || exit 1"]
      <<: *spring-healthcheck
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy
      kafka:
        condition: service_healthy

  document-service:
    build:
      context: ../services/document-service
      dockerfile: Dockerfile
    container_name: document-service
    ports:
      - "8088:8088"
    environment:
      <<: [*spring-common, *spring-db]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/document_db
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: legal-documents
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8088/actuator/health || exit 1"]
      <<: *spring-healthcheck
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ════════════════════════════════════════════════════════════════════════════
  # FASTAPI SERVICE
  # ════════════════════════════════════════════════════════════════════════════

  ai-analysis-service:
    build:
      context: ../services/ai-analysis-service
      dockerfile: Dockerfile
    container_name: ai-analysis-service
    ports:
      - "8087:8087"
    environment:
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/ai_analysis_db
      UPLOAD_DIR: /app/uploads
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - analysis_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8087/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy
      ollama:
        condition: service_healthy

volumes:
  postgres_data:
  user_uploads:
  analysis_uploads:
  ollama_data:
  minio_data:
